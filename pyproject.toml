[project]
name = "tally_migrator"
version = "1.0.0"
authors = [{ name = "Frappe Technologies Pvt. Ltd.", email = "developers@frappe.io" }]
description = "Migrate masters and transactions from Tally to ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dependencies = ["defusedxml>=0.7"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tally_migrator*"]

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
erpnext = ">=15.0.0,<17.0.0"
